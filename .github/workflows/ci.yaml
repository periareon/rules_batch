name: CI

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize

env:
  BAZEL_STARTUP_FLAGS: --bazelrc=${{ github.workspace }}/.github/github.bazelrc

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: ci (${{ matrix.os }}${{ matrix.runfiles && format(', {0} runfiles', matrix.runfiles) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows runs twice in parallel: with manifest-only runfiles (the
        # default) and with a populated runfiles tree, since scripts resolve
        # runfiles differently in each mode.
        include:
          - os: macos-latest
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2022
            runfiles: manifest
          - os: windows-2022
            runfiles: symlinks
    steps:
      # Batch files must be CRLF for cmd to find labels. .gitattributes enforces
      # that; checking out with autocrlf=input proves it, like a tarball would.
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Configure Bazel (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" >> user.bazelrc

      - name: Enable runfiles symlinks (Windows)
        if: matrix.runfiles == 'symlinks'
        run: |
          echo "startup --windows_enable_symlinks" >> user.bazelrc
          echo "build --enable_runfiles" >> user.bazelrc

      - name: Test
        run: bazel $BAZEL_STARTUP_FLAGS test //...

  ci-examples:
    name: ci-examples (${{ matrix.os }}${{ matrix.runfiles && format(', {0} runfiles', matrix.runfiles) || '' }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2022
            runfiles: manifest
          - os: windows-2022
            runfiles: symlinks
    steps:
      - run: git config --global core.autocrlf input
        working-directory: .
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Configure Bazel (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" >> user.bazelrc

      - name: Enable runfiles symlinks (Windows)
        if: matrix.runfiles == 'symlinks'
        run: |
          echo "startup --windows_enable_symlinks" >> user.bazelrc
          echo "build --enable_runfiles" >> user.bazelrc

      - name: Configure Bazel
        run: echo "common --keep_going" >> user.bazelrc

      - name: Test
        run: bazel $BAZEL_STARTUP_FLAGS test //...

      # Outside of `bazel test` and `bazel run` no RUNFILES_* variables are set,
      # so the preamble must discover the manifest next to the built script.
      - name: Run binaries directly (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bazel $env:BAZEL_STARTUP_FLAGS build //:greet //:inline_greet //:parent
          foreach ($bin in "greet", "inline_greet", "parent") {
            & ".\bazel-bin\$bin.bat"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  ci-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # cmd.exe fails to find labels in batch files with LF line endings;
      # .gitattributes forces CRLF at checkout and this verifies it held.
      - name: Check batch file line endings
        run: |
          bad=""
          while IFS= read -r f; do
            if tr -d '\r' < "${f}" | cmp -s - "${f}"; then bad="${bad}${f}"$'\n'; fi
          done < <(find . -name .git -prune -o -type f \( -name '*.bat' -o -name '*.cmd' \) -print)
          if [[ -n "${bad}" ]]; then
            echo "ERROR: batch files without CRLF line endings:" >&2
            echo -n "${bad}" >&2
            exit 1
          fi

      - name: Buildifier
        run: |
          wget "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION}/buildifier-linux-amd64" -O buildifier
          chmod +x ./buildifier
          ./buildifier -lint=warn -mode=check -warnings=all -r ${{ github.workspace }}
          rm ./buildifier
        env:
          BUILDIFIER_VERSION: 8.2.0
